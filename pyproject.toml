[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pressure-probe"
version = "1.0.0"
description = "Contrastive pressure probes for detecting consistent hallucinations in large language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43", "datasets>=2.20", "huggingface_hub>=0.24"]
fast = ["vllm>=0.6"]
judge = ["openai>=1.40"]
dev = ["pytest>=8.0", "nbformat>=5.9"]

[project.scripts]
pressure-probe = "pressure_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
